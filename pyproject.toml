[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "senviok"
version = "0.1.0"
description = "Python client for the Senviok messaging API (email, SMS, WhatsApp)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Senviok" }]
keywords = ["email", "sms", "whatsapp", "messaging", "senviok"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
dependencies = [
    "httpx>=0.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "respx>=0.20",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["senviok"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
